name: Installed native authoring tasks (artifacts only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  native-tasks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install native authoring dependencies
        run: python -m pip install sympy==1.13.3 PyYAML==6.0.2
      - name: Prepare saved synthetic file with spaces
        run: python scripts/check-native-tasks.py --project "$RUNNER_TEMP/template task project" --prepare
      - name: Install the template's explicit reviewed native pack
        run: python scripts/install-native-authoring.py --project "$RUNNER_TEMP/template task project"
      - name: Verify installed task resolution and local helper transport
        run: python scripts/check-native-tasks.py --project "$RUNNER_TEMP/template task project"
      - uses: actions/upload-artifact@v4
        with:
          name: installed-native-task-proof
          path: |
            ${{ runner.temp }}/template task project/proof-evidence
            ${{ runner.temp }}/template task project/.private-extensions/resolved-repos.json
