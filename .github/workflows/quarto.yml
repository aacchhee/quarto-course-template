name: Render and Publish Quarto

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - refactor-pyodide-interaktiv

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out course repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install jupyter nbformat sympy==1.13.3 PyYAML==6.0.2

      - name: Install the reviewed canonical native pack
        run: python scripts/install-native-authoring.py

      - name: Render Quarto project
        run: quarto render

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}